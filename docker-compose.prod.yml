# =============================================================================
# AutoCommerce Enterprise V27.1 — docker-compose.prod.yml
# Déploiement production monoserveur durci
# =============================================================================

x-common-env: &common-env
  env_file:
    - .env.prod
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    <<: *common-env
    image: pgvector/pgvector:pg16
    container_name: ac_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autocommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-autocommerce}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autocommerce} -d ${POSTGRES_DB:-autocommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s

  redis:
    <<: *common-env
    image: redis:7-alpine
    container_name: ac_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
      --appendfsync everysec
      --protected-mode yes
    volumes:
      - redis_data:/data
    networks:
      - backend
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s

  migrate:
    <<: *common-env
    build:
      context: ./api-server
      dockerfile: Dockerfile
      target: runtime
    container_name: ac_migrate
    command: ["python3", "-m", "alembic", "upgrade", "head"]
    environment:
      RUN_MIGRATIONS_ON_BOOT: "0"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    pids_limit: 128

  api:
    <<: *common-env
    build:
      context: ./api-server
      dockerfile: Dockerfile
      target: runtime
    container_name: ac_api
    environment:
      RUN_MIGRATIONS_ON_BOOT: "0"
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.16.0.0/12,127.0.0.1}
      SKIP_LIMITER: "0"
    volumes:
      - uploads_data:/app/uploads
      - api_logs:/app/logs
    networks:
      - backend
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1536M
        reservations:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    pids_limit: 256
    stop_grace_period: 45s

  celery:
    <<: *common-env
    build:
      context: ./api-server
      dockerfile: Dockerfile
      target: runtime
    container_name: ac_celery
    command: >
      python3 -m celery -A services.celery_app worker
      --loglevel=info
      --queues=celery,whatsapp,social,ai,billing,payments
      --concurrency=4
      --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-200}
    environment:
      RUN_MIGRATIONS_ON_BOOT: "0"
      SKIP_LIMITER: "0"
    volumes:
      - uploads_data:/app/uploads
      - api_logs:/app/logs
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    pids_limit: 256
    stop_grace_period: 45s

  frontend:
    <<: *common-env
    build:
      context: ./autocommerce-app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: ac_frontend
    environment:
      API_UPSTREAM: "http://api:8000"
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,noexec,nosuid
      - /var/run:size=8m,noexec,nosuid
      - /tmp:size=32m,noexec,nosuid
    pids_limit: 128

  nginx:
    <<: *common-env
    image: nginx:1.27-alpine
    container_name: ac_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.tls.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && curl -fsS http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,noexec,nosuid
      - /var/run:size=8m,noexec,nosuid
      - /tmp:size=32m,noexec,nosuid
    pids_limit: 128
    stop_grace_period: 20s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  api_logs:
    driver: local
  nginx_logs:
    driver: local

networks:
  backend:
    driver: bridge
    internal: true
  frontend:
    driver: bridge
